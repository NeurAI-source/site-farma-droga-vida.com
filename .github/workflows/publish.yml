name: Publicar site
on:
  workflow_dispatch:
    inputs:
      publication_id:
        description: Publicação criada pelo painel (vazio para publicar o código)
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: site-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' && 'https://drogavidapopular.com.br' || steps.deployment.outputs.page_url }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PUBLICATION_ID: ${{ inputs.publication_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/cloud-catalog.mjs fetch
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run build
        env:
          CATALOG_FILE: published-catalog.json
      - uses: actions/configure-pages@v5
        if: vars.CLOUDFLARE_ACCOUNT_ID == ''
      - uses: actions/upload-pages-artifact@v3
        if: vars.CLOUDFLARE_ACCOUNT_ID == ''
        with:
          path: dist
      - id: deployment
        if: vars.CLOUDFLARE_ACCOUNT_ID == ''
        uses: actions/deploy-pages@v4
      - name: Publicar no Cloudflare Pages
        id: cloudflare
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler pages deploy dist --project-name=droga-vida-popular --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Confirmar publicação
        run: node scripts/cloud-catalog.mjs published
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Registrar falha
        if: failure() && steps.deployment.outcome != 'success' && steps.cloudflare.outcome != 'success'
        run: node scripts/cloud-catalog.mjs failed
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
